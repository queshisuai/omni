services:
  postgres:
    image: postgres:17-alpine
    container_name: omni-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - omni-postgres-data:/var/lib/postgresql/data
      - ./sql/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: omni-redis
    ports:
      - "6379:6379"
    volumes:
      - omni-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: omni-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      PREFER_HOST_MODE: hostname
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - omni-nacos-data:/home/nacos/data
      - omni-nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  seata-config-init:
    image: curlimages/curl:8.8.0
    container_name: omni-seata-config-init
    depends_on:
      nacos:
        condition: service_healthy
    volumes:
      - ./docker/seata:/seata-config:ro
    environment:
      NACOS_ADDR: nacos:8848
      SEATA_CONFIG_DATA_ID: seataServer.properties
      SEATA_CONFIG_GROUP: SEATA_GROUP
    command: ["/bin/sh", "/seata-config/import-config.sh"]
    restart: "no"

  seata-server:
    image: seataio/seata-server:1.6.1
    container_name: omni-seata
    depends_on:
      nacos:
        condition: service_healthy
      seata-config-init:
        condition: service_completed_successfully
    environment:
      SEATA_IP: ${SEATA_ADVERTISE_HOST:-127.0.0.1}
      SEATA_PORT: ${SEATA_ADVERTISE_PORT:-8091}
    command: ["-h", "${SEATA_ADVERTISE_HOST:-127.0.0.1}", "-p", "${SEATA_ADVERTISE_PORT:-8091}"]
    ports:
      - "8091:8091"
      - "7091:7091"
    volumes:
      - ./docker/seata/application.yml:/seata-server/resources/application.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8091' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  omni-postgres-data:
  omni-redis-data:
  omni-nacos-data:
  omni-nacos-logs:
