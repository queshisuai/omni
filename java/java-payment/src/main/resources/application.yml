server:
  port: 8084

spring:
  application:
    name: java-payment
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/omni_ticket
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
      config:
        import-check:
          enabled: false
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        file-extension: yaml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: ${SENTINEL_PAYMENT_TRANSPORT_PORT:8723}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

alipay:
  gateway-url: ${ALIPAY_GATEWAY_URL:}
  app-id: ${ALIPAY_APP_ID:}
  merchant-private-key: ${ALIPAY_MERCHANT_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  return-url: ${ALIPAY_RETURN_URL:}
  notify-url: ${ALIPAY_NOTIFY_URL:}
  sign-type: RSA2
  charset: utf-8
  format: json
  mock-qr-fallback-enabled: ${ALIPAY_MOCK_QR_FALLBACK_ENABLED:false}
  mock-qr-auto-confirm-enabled: ${ALIPAY_MOCK_QR_AUTO_CONFIRM_ENABLED:false}

internal:
  api:
    token: ${INTERNAL_API_TOKEN:omni-local-internal-token}
