server:
  port: 8082

spring:
  application:
    name: java-ticket
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/omni_ticket
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
      config:
        import-check:
          enabled: false
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        file-extension: yaml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: ${SENTINEL_TICKET_TRANSPORT_PORT:8721}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:123456}
    virtual-host: /
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

internal:
  api:
    token: ${INTERNAL_API_TOKEN:omni-local-internal-token}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

omni:
  mq:
    enabled: true
  search:
    provider: elasticsearch
    require-elasticsearch: true
    index-name: ${OMNI_ACTIVITY_SEARCH_INDEX:omni_activity_v1}
    alias-name: ${OMNI_ACTIVITY_SEARCH_ALIAS:omni_activity_current}
  ticket:
    ai:
      enabled: ${OMNI_TICKET_AI_ENABLED:true}
      endpoint: ${OMNI_TICKET_AI_ENDPOINT:http://localhost:11434/api/chat}
      model: ${OMNI_TICKET_AI_MODEL:Qwen2.5:7b}
      timeout-ms: ${OMNI_TICKET_AI_TIMEOUT_MS:30000}
      context-window: ${OMNI_TICKET_AI_CONTEXT_WINDOW:2048}
      api-key: ${OMNI_TICKET_AI_API_KEY:}
