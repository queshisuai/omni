server:
  port: 8082

spring:
  application:
    name: java-ticket
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/omni_ticket
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
      config:
        import-check:
          enabled: false
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        file-extension: yaml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: ${SENTINEL_TICKET_TRANSPORT_PORT:8721}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:123456}
    virtual-host: /

internal:
  api:
    token: ${INTERNAL_API_TOKEN:omni-local-internal-token}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

omni:
  mq:
    enabled: true
  search:
    es:
      enabled: ${OMNI_SEARCH_ES_ENABLED:false}
      uris: ${OMNI_SEARCH_ES_URIS:http://localhost:9200}
      index-alias: ${OMNI_SEARCH_ES_INDEX_ALIAS:omni_activity_search_current}
      connect-timeout-ms: ${OMNI_SEARCH_ES_CONNECT_TIMEOUT_MS:1000}
      read-timeout-ms: ${OMNI_SEARCH_ES_READ_TIMEOUT_MS:1500}
