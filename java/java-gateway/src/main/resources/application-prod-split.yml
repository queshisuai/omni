spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST}:${NACOS_PORT}
      config:
        import-check:
          enabled: false
        server-addr: ${NACOS_HOST}:${NACOS_PORT}
        file-extension: yaml
    gateway:
      routes:
        - id: support-stream-service
          uri: lb://java-user
          predicates:
            - Path=/api/user/support/conversations/{conversationId}/messages/stream
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${GATEWAY_STREAM_RESPONSE_TIMEOUT_MS:-1}
        - id: user-auth-service
          uri: lb://java-user
          predicates:
            - Path=/api/user/login,/api/user/send-code
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${GATEWAY_SHORT_RESPONSE_TIMEOUT_MS:3000}
        - id: user-service
          uri: lb://java-user
          predicates:
            - Path=/api/user/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${GATEWAY_DEFAULT_ROUTE_RESPONSE_TIMEOUT_MS:5000}
        - id: ticket-hot-read-service
          uri: lb://java-ticket
          predicates:
            - Path=/api/ticket/activities,/api/ticket/sessions/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${GATEWAY_SHORT_RESPONSE_TIMEOUT_MS:3000}
        - id: ticket-service
          uri: lb://java-ticket
          predicates:
            - Path=/api/ticket/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${GATEWAY_DEFAULT_ROUTE_RESPONSE_TIMEOUT_MS:5000}
        - id: ticket-uploads
          uri: lb://java-ticket
          predicates:
            - Path=/uploads/ticket/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${GATEWAY_UPLOAD_RESPONSE_TIMEOUT_MS:10000}
        - id: user-uploads
          uri: lb://java-user
          predicates:
            - Path=/uploads/user/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${GATEWAY_UPLOAD_RESPONSE_TIMEOUT_MS:10000}
        - id: order-read-service
          uri: lb://java-order
          predicates:
            - Path=/api/order/user/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${GATEWAY_SHORT_RESPONSE_TIMEOUT_MS:3000}
        - id: order-service
          uri: lb://java-order
          predicates:
            - Path=/api/order/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${GATEWAY_DEFAULT_ROUTE_RESPONSE_TIMEOUT_MS:5000}
        - id: payment-sync-service
          uri: lb://java-payment
          predicates:
            - Path=/api/payment/alipay/sync/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${GATEWAY_LONG_RESPONSE_TIMEOUT_MS:15000}
        - id: payment-service
          uri: lb://java-payment
          predicates:
            - Path=/api/payment/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${GATEWAY_DEFAULT_ROUTE_RESPONSE_TIMEOUT_MS:5000}
        - id: notification-service
          uri: lb://java-notification
          predicates:
            - Path=/api/notification/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${GATEWAY_SHORT_RESPONSE_TIMEOUT_MS:3000}
        - id: waitlist-service
          uri: ${GATEWAY_WAITLIST_SERVICE_URI}
          predicates:
            - Path=/api/waitlist/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${GATEWAY_LONG_RESPONSE_TIMEOUT_MS:15000}
        - id: grab-service
          uri: ${GATEWAY_GRAB_SERVICE_URI}
          predicates:
            - Path=/api/grab/**
          metadata:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${GATEWAY_LONG_RESPONSE_TIMEOUT_MS:15000}
